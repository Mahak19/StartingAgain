<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(176, 20, 248);
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background-color: rgb(134, 1, 196);
        }

        img {
            height: 90px;
            width: 90px;
        }

        .nav-link {
            margin-left: 50vw;
        }

        .nav-link a {
            margin: 0px 50px 0px 0px;
            text-decoration: none;
            color: black;
            font-size: 21px;
            font-weight: bold;
        }

        main {
            padding: 20px;
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        h1 {
            color: rgb(223, 164, 250);
            font-size: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
            font-family: cursive;
            padding-left: 20px;
        }

       .welcome-message {
            padding-left: 20px;
            color: rgb(223, 164, 250);
            font-size: 20px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            /* align-items: center; */
        }

        .btn {
            background-color: rgb(199, 83, 253);
            border: none;
            color: white;
            font-weight: bold;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: rgb(205, 130, 240);
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: rgb(134, 1, 196);
            font-weight: bold;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>

    <main>

        </div>
        <div class="product">

        </div>
        <div class="product">
