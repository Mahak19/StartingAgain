<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            /* gap: 20px; */
            background-color: rgb(240, 240, 240);
            padding: 10px;
        }
        img{
            height: 80px;
            width: 140px;
            border-radius: 5px;
        }
        .lower{
            display:flex;
            gap : 20px;
            opacity: 0.5;
            font-size: 14px;
        }
        .name{
            margin-top: 4px;
            font-size: 18px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-weight: bold;
        }
        .lower p{
            margin-top: 0px;
        }
        .time{
            font-size: 12px;
            font-weight: bold;
            background-color: rgb(68, 68, 68);
            color: white;
            border: 1px solid black;
            border-radius: 4px;
            padding: 1px;
            position: relative;
            right: 40px;
            bottom: 10px;
        }

        
    </style>
</head>

<body>
    <div class="container">
        <div class="right">
            <img src="RK.jpg" alt="logo">
            <span class="time">31:19</span>
        </div>
        <div class="left">
            <p class="name">Installing VS Code & How Websites Work | Sigma Web Development Course - Tutorial #1</p>
            <div class="lower">
                <p class="cName">CWH</p>
                <p class="views">1.2M views</p>
                <p class="date">1 year ago</p>
            </div>
        </div>
    </div>
</body>

</html>
