<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist UI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        /* Main container */
        .video-card {
            display: flex;
            gap: 12px;
            width: 520px;
            padding: 10px;
            background-color: white;
            cursor: pointer;
        }

        .video-card:hover {
            background-color: #f2f2f2;
        }

        /* Thumbnail section */
        .thumbnail {
            position: relative;
        }

        .thumbnail img {
            width: 168px;
            height: 94px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Time badge */
        .video-duration {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 12px;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* Video info */
        .video-info {
            display: flex;
            flex-direction: column;
        }

        .video-title {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.3;
            color: #000;
        }

        /* Meta info (channel, views, date) */
        .video-meta {
            display: flex;
            gap: 6px;
            font-size: 13px;
            color: #606060;
            margin-top: 6px;
        }

        .video-meta p {
            margin: 0;
        }

    </style>
</head>

<body>

    <div class="video-card">

        <!-- Thumbnail -->
        <div class="thumbnail">
            <img src="RK.jpg" alt="thumbnail">
            <span class="video-duration">31:19</span>
        </div>

        <!-- Video Info -->
        <div class="video-info">
            <p class="video-title">
                Installing VS Code & How Websites Work | Sigma Web Development Course - Tutorial #1
            </p>

            <div class="video-meta">
                <p class="channel-name">CodeWithHarry</p>
                <p class="views">• 1.2M views</p>
                <p class="upload-time">• 1 year ago</p>
            </div>
        </div>

    </div>
    <script src="hw9WebpagePlaylist.js"></script>

</body>
</html>
