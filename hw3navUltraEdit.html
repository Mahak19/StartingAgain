<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        img {
            width: 40px;
            height: 40px;
            margin: 0px 60px -48px 170px;
            border-radius: 7px;
        }

        .name {
            margin: -100px 0px 0px 220px;
            font-size: 23px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: bold;
        }

        .logo {
            margin: -3px 0px 0px 255px;
            font-size: 9px;
            font-family: sans-serif;
        }

        .sec {
            display: flex;
            margin: -25px 210px 0px 0px;
            list-style: none;
            justify-content: right;
        }

        ul li a {
            text-decoration: none;
            color: black;
            padding-left: 30px;
            font-size: 13px;
        }

        .txt {
            font-size: 40px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 60px 0px 0px 330px;
        }

        .icon {
            color: orange;
            margin: 83px 0px 0px 20px;

        }

        .second {
            display: flex;
        }

        .belowtext {
            font-size: 15px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            width: 700px;
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            background-color: rgb(59, 148, 243);
            color: white;
            font-weight: bold;
            font-size: 11px;
            border: none;
            height: 40px;
            width: 200px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .tbtn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        button:hover{
            background-color: rgb(59, 148, 243, 0.8);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <navbar>
        <ul class="nav">
            <li><a href="#"><img src="RK.jpg" alt=""></a></li>
            <li><a href="" class="name">UltraEdit</a></li>
            <li>
                <p class="logo">An Idea Inc. Company</p>
            </li>
        </ul>
        <ul class="sec">
            <li><a href="#">Products</a><i class="fa-solid fa-angle-down fa-sm"></i></li>
            <li><a href="#">Pricing</a><i class="fa-solid fa-angle-down fa-sm"></i></li>
            <li><a href="#">Resources</a><i class="fa-solid fa-angle-down fa-sm"></i></li>
            <li><a href="#">About us</a><i class="fa-solid fa-angle-down fa-sm"></i></li>
            <li><a href=""><i class="fa-regular fa-circle-question"></i></a></li>
        </ul>
    </navbar>
    <div class="second">
        <p class="txt">Download <b>UltraEdit</b> for Windows</p>
        <i class="fa-solid fa-ranking-star fa-2xl icon"></i>
    </div>
    <div class="tbtn">
        <p class="belowtext">Download and try UltraEdit before you buy it! This download includes the full Windows
            version of the text editor.</p>
        <button class="btn">Download Mac or Linux Version</button>
    </div>

</body>

</html>
