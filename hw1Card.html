<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .card {
        width: 360px;
        padding: 4px;
        border: 2px solid black;
        border-radius: 10px;
    }

    .card img {
        height: 290px;
        width: 100%;
        border-radius: 10px;
    }

    .d1 {
        margin: 4px;
    }

    .d2 {
        padding: 8px;
    }

    .d3 {
        padding-left: 120px;
    }

    .b1,
    .b2 {
        border: 1px solid rgb(199, 199, 199);
        border-radius: 20px;
        margin: 10px 0px 20px 0px;
        background-color: #fff;
        color: rgb(94, 93, 93);
    }

    .b1 {
        padding: 3px;
        width: 45px;
    }

    .b2 {
        padding: 3px;
        width: 60px;
    }

    .txt {
        font-size: 20px;
        font-weight: 400;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        padding-bottom: 20px;
    }

    .btn {
        height: 30px;
        width: 90px;
        padding: 37px 0px 110px 0px;
        border: 1px solid rgb(167, 186, 205);
        border-radius: 20px;
        color: rgb(3, 98, 176);
        background-color: rgb(167, 186, 205);
        padding: 3px;
        font-weight: 700;
    }
</style>

<body>
    <div class="card">
        <div class="d1">
            <img src="RK.jpg" alt="img">
        </div>
        <div class="d2">
            <button class="b1">Shriji</button>
            <button class="b2">Kanhaji</button>
            <div class="txt">Shree RadheShyam</div>
            <div>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Sunt quo nihil pariatur quaerat excepturi.
                Qui alias, quam officiis sed modi distinctio.</div>
        </div>
        <div class="d3">
            <button class="btn">Read More</button>
        </div>
    </div>
</body>

</html>
