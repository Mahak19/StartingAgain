<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .nav {
            background-color: pink;
            position: sticky;
            top: 0;
            z-index: 1;
            height: 190px;
        }

        .boxes {
            background-color: green;
            margin: 5px;
            position: relative;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .b1 {
            width: 180px;
            height: 180px;
            background-color: red;
        }

        .b2 {
            width: 180px;
            height: 180px;
            background-color: blue;
        }

        .box {
            border: 1px solid gray;
            border-radius: 15px;
            height: 590px;
            margin: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
        }

        .icon {
            background-color: orange;
            height: 40px;
            width: 40px;
            border-radius: 100%;
            position: fixed;
            bottom: 15px;
            right: 25px;
        }

        .foot {
            background-color: burlywood;
            height: 290px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav"></div>
        <div class="boxes">
            <div class="b1"></div>
            <div class="b2"></div>
        </div>
        <div class="icon"></div>
        <div class="box">
            Welcome to Sigma Web Dev Course
        </div>
        <div class="foot"></div>
    </div>
</body>

</html>
